name: grad_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.0.7
  intl: ^0.20.2

  # 🔹 Firebase
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3

  # 🔹 Google Maps
  google_maps_flutter: ^2.5.0

  # 🔹 UI
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Frame13.png"

flutter_native_splash:
  color: "#eef0f4"
  image: "assets/images/Frame13.png"
  android_12:
    color: "#eef0f4"
    image: "assets/images/Frame13.png"

flutter:
  uses-material-design: true

  fonts:
    - family: PTSerif
      fonts:
        - asset: assets/fonts/pt-serif.regular.ttf
        - asset: assets/fonts/pt-serif.bold.ttf
          weight: 700

  assets:
    - assets/images/